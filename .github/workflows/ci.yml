name: ENCTXT Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Build, Typecheck & Security Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: enctxt_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Clean Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma ORM Client
        run: npm run prisma:generate

      - name: Execute Database Migrations against CI Database
        run: npx prisma migrate deploy --schema=server/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/enctxt_ci_test?schema=public

      - name: Static Typecheck across all Workspaces
        run: npm run typecheck

      - name: Run Full Automated Test Suite (150+ Tests)
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/enctxt_ci_test?schema=public
          JWT_SECRET: ci_test_jwt_secret_key_minimum_32_characters_long_for_security!

      - name: Production Bundle & Server Compilation
        run: npm run build

      - name: Dependency Security Audit
        run: npm audit --audit-level=high || true

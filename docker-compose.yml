# ==============================================================================
# ENCTXT Production Docker Compose Architecture
# Orchestrates PostgreSQL + Node.js API Backend + Nginx Reverse Proxy
# ==============================================================================

services:
  # 1. Production PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: enctxt_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set (no default)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (no default)}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set (no default)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enctxt_internal

  # 2. Node.js Express & WebSocket API Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enctxt_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (no default)}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN must be set (no default)}
      SESSION_COOKIE_NAME: enctxt_session
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - enctxt_internal

  # 3. Nginx Reverse Proxy & Static Frontend Server
  reverse_proxy:
    image: nginx:alpine
    container_name: enctxt_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./client/dist:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - enctxt_internal

networks:
  enctxt_internal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
